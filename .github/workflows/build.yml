name: build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  Warp_Chrome:
    runs-on: ubuntu-latest
    outputs:
      build_name: ${{ steps.build.outputs.BUILD_NAME }}
      chrome_version: ${{ steps.build.outputs.CHROME_VERSION }}
      chrome_plus_version: ${{ steps.build.outputs.CHROME_PLUS_VERSION }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - run: ls
      - name: prepare env
        id: build
        run: |
          python3 -m pip install -r requirements.txt
          python3 run.py
      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BUILD_NAME }}
          path: build/release/*
          retention-days: 15
          if-no-files-found: error

  Release:
    name: Publish release
    needs: Warp_Chrome
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BUILD_NAME: ${{ needs.Warp_Chrome.outputs.build_name }}
      CHROME_VERSION: ${{ needs.Warp_Chrome.outputs.chrome_version }}
      CHROME_PLUS_VERSION: ${{ needs.Warp_Chrome.outputs.chrome_plus_version }}
    steps:
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.BUILD_NAME }}
          path: build/release

      - name: Package release assets
        run: |
          test -s build/release/Chrome/chrome.exe
          test -s build/release/Chrome/version.dll
          test -s build/release/Chrome/chrome++.ini
          cd build/release
          zip -qr "../${BUILD_NAME}.zip" Chrome
          cd ..
          sha256sum "${BUILD_NAME}.zip" > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          release_tag="v${CHROME_VERSION}-build.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          release_title="Chrome ${CHROME_VERSION} / chrome_plus ${CHROME_PLUS_VERSION} (Build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT})"

          cat > release-notes.md <<EOF
          Windows x64 便携版，自动构建并归档。

          - Chrome：${CHROME_VERSION}
          - chrome_plus：${CHROME_PLUS_VERSION}
          - 构建记录：[Build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})
          - 源码提交：${GITHUB_SHA}

          下载 **${BUILD_NAME}.zip**，解压后运行 Chrome/chrome.exe。
          **SHA256SUMS.txt** 提供压缩包的 SHA-256 校验值。
          EOF

          gh release create "$release_tag" \
            "build/${BUILD_NAME}.zip" \
            "build/SHA256SUMS.txt" \
            --target "$GITHUB_SHA" \
            --title "$release_title" \
            --notes-file release-notes.md \
            --latest
